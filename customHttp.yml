# AWS Amplify Hosting custom HTTP headers for the apps in src/. Amplify reads
# headers for monorepo apps only from this file at the repository root, so
# each app's headers live in the entry whose appRoot is that app's folder.
# Every app deployed from this repository needs an entry here, even one with
# no headers of its own: Amplify fails the deploy of any app it cannot find.
applications:
  - appRoot: src/documents
    customHeaders:
      # Revalidate the app entry point, including visits without index.html.
      - pattern: '/'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
      - pattern: '**/*.html'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'

      # Vite includes content hashes in generated asset filenames.
      # Keep unversioned public files outside this directory.
      - pattern: '/assets/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
  - appRoot: src/whiteboard
    customHeaders:
      # Revalidate the app entry point, including visits without index.html.
      - pattern: '/'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
      - pattern: '**/*.html'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'

      # Vite includes content hashes in generated asset filenames, and the
      # pdf.js decoders sit in a folder named after the pdf.js version.
      - pattern: '/assets/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
