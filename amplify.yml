# AWS Amplify Hosting build settings. Each folder in src/ is deployed as its
# own Amplify app, connected to this repository as a monorepo app whose root
# is that folder. Amplify picks the entry below whose appRoot matches the app's
# AMPLIFY_MONOREPO_APP_ROOT environment variable, runs its commands inside
# that folder, and publishes its dist/ folder.
version: 1
applications:
  - appRoot: src/whiteboard
    frontend:
      phases:
        preBuild:
          commands:
            # package.json requires Node >= 22.12; install the latest 22.x.
            - nvm install 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: src/documents
    frontend:
      phases:
