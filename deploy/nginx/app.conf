# Shared static-site rules mirroring customHttp.yml for typical Vite apps.
# Each location that sets Cache-Control also includes profile.inc so CSP and
# related headers are not dropped (nginx clears inherited add_header when a
# location defines its own).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /worker/ {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.wasm$ {
        include /etc/nginx/conf.d/profile.inc;
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/profile.inc;
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
