<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SOP Graph — Houdini-inspired procedural point nodes in the browser." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-128.png" type="image/png" sizes="128x128" />
    <title>SOP Graph</title>
  </head>
  <body>
    <div id="app">
      <div class="brand">
        <img src="icon-128.png" width="28" height="28" alt="" />
        <h1>SOP Graph</h1>
      </div>
      <div class="layout">
        <aside class="panel">
          <h2 style="margin:0 0 .5rem;font-size:.95rem;">Network</h2>
          <ul id="nodes"></ul>
          <label>Noise amp <input id="amp" type="range" min="0" max="0.8" step="0.01" value="0.25" /></label>
          <p id="meta" style="color:#7ad0ff"></p>
        </aside>
        <main class="panel">
          <canvas id="view" width="900" height="520"></canvas>
        </main>
      </div>
      <details class="help">
        <summary>About / #61</summary>
        <p>
          Houdini-inspired SOP network for
          <a href="https://github.com/HeyPuter/everything/issues/61">#61</a>: Grid → Noise → Transform → Output.
          Original browser graph — not SideFX Houdini; no simulation baking yet (DOCUMENTED).
        </p>
      </details>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
