<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Project Management</title>
  <meta name="description" content="Kanban boards, timelines, and milestones. Lightweight project management on your own Puter cloud." />
  <link rel="canonical" href="https://projects.puter.com/" />
  <meta name="theme-color" content="#8833eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Projects" />
  <!-- Every icon here is generated from icon.png by scripts/build-icons.sh. -->
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="./favicon-16.png" sizes="16x16" />
  <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('pm:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <!-- defer keeps the SDK ahead of the module script below (same in-order
       queue) without parser-blocking first paint. -->
  <script src="https://js.puter.com/v2/" defer></script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot-splash" aria-hidden="true">
      <img src="./icon-192.png" width="52" height="52" alt="" />
    </div>
  </div>
</body>
</html>
