<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="160" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>
  <circle cx="400" cy="300" r="80" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.9"/>
  <path d="M400 240 L400 360 M340 300 L400 360 L460 300" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">PUTER DOWNLOADER</text>
  <text x="400" y="475" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Sample Vector Wallpaper</text>
</svg>
