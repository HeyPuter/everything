<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Database Studio — in-browser tables and a tiny SQL subset. DataGrip-inspired." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-128.png" type="image/png" sizes="128x128" />
    <title>Database Studio</title>
  </head>
  <body>
    <div id="app">
      <header class="brand">
        <img src="icon-128.png" width="28" height="28" alt="" />
        <h1>Database Studio</h1>
      </header>
      <main class="layout">
        <aside class="panel">
          <h2>Tables</h2>
          <ul id="tables"></ul>
        </aside>
        <section class="work">
          <textarea id="sql" rows="4" spellcheck="false">SELECT * FROM employees WHERE dept = 'Eng'</textarea>
          <div class="row">
            <button class="btn" id="run" type="button">Run</button>
            <p id="status" role="status"></p>
          </div>
          <div id="grid"></div>
        </section>
      </main>
      <details class="help">
        <summary>DOCUMENTED vs LIVE</summary>
        <p>
          DataGrip (DOCUMENTED) connects to LIVE Postgres/MySQL/etc. This v0 explores seeded in-memory
          tables with a tiny SELECT/WHERE subset — no remote credentials and no fabricated LIVE access.
        </p>
      </details>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
