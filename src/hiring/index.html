<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Hiring & applicant tracking: job pages, candidate pipeline, interview scheduling, scorecards, offers, and onboarding."
    />
    <title>Hiring · Applicant Tracking</title>
    <link rel="canonical" href="https://hiring.puter.com/" />
    <meta name="theme-color" content="#fad319" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hiring" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('hiring.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body></body>
</html>
