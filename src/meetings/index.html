<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124" />
    <meta name="description" content="Free video meetings in your browser. No downloads, just a link you can share." />
    <link rel="canonical" href="https://meetings.puter.com/" />
    <title>Puter Meetings</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = (localStorage.getItem('pm.theme') || '').replace(/"/g, '');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* private mode */ }
      })();
    </script>
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
