<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191d" />
    <meta
      name="description"
      content="3D is a focused browser-based workspace for creating and arranging 3D scenes."
    />
    <title>3D · Scene editor</title>
    <link rel="canonical" href="https://3d.puter.com/" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <!-- The app works without Puter (offline, blocked): a failed load only leaves out the account menu,
         and the assistant tries again when it is used (src/assistant/puter.ts). With Preferences ▸
         System ▸ Network ▸ Allow Online Access off nothing is fetched. -->
    <script>
      (function () {
        var online = true;
        try {
          var p = JSON.parse(localStorage.getItem('p3d.preferences.v1') || 'null');
          online = !p || p.use_online_access !== false;
        } catch (e) {}
        if (!online) return;
        var s = document.createElement('script');
        s.src = 'https://js.puter.com/v2/';
        s.async = true;
        s.onerror = function () {
          window.__puterFailed = true;
        };
        // arriving after the app started: the top bar adds the account menu (src/ui/shell.ts)
        s.onload = function () {
          dispatchEvent(new Event('puter-loaded'));
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
