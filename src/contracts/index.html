<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contract Manager</title>
  <meta name="description" content="Store agreements, track renewal dates, extract obligations, and connect documents to contacts." />
  <link rel="canonical" href="https://contracts.puter.com/" />
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Contracts" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="./icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('cm:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <!-- defer keeps the SDK ahead of the module script below (same in-order
       queue) without parser-blocking first paint. -->
  <script src="https://js.puter.com/v2/" defer></script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
</body>
</html>
