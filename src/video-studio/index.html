<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video Studio</title>
  <meta name="description" content="A multi-track video editor: trim, split, add text, effects, transitions, filters, keyframes and captions, then export. Projects are stored in your own Puter cloud." />
  <link rel="canonical" href="https://vs.puter.com/" />
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="./manifest.json" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (() => {
      let t = 'dark';
      try { t = localStorage.getItem('video-studio:theme') || 'dark'; } catch {}
      const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      const root = document.documentElement;
      root.dataset.theme = t;
      root.dataset.themeResolved = dark ? 'dark' : 'light';
    })();
  </script>
  <script src="https://js.puter.com/v2/" defer></script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to editor</a>
  <div id="app" class="app" aria-busy="true"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
